[project]
name = "nrc-volt-sync"
version = "0.3.0"
description = "Free Apple Health or Strava bridge to Garmin Connect and Nike Run Club"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
keywords = [
    "apple-health",
    "apple-watch",
    "garmin-connect",
    "healthkit",
    "nike-run-club",
    "nike-running-club",
    "nrc",
    "running",
    "strava",
    "workout-sync",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "garmin-fit-sdk>=21.188.0",
    "garminconnect>=0.2.38",
    "httpx>=0.28.1",
]

[project.scripts]
nrc-volt-sync = "nrc_volt_sync.cli:main"

[dependency-groups]
dev = [
    "bandit>=1.9.2",
    "coverage>=7.10.7",
    "pip-audit>=2.9.0",
    "pytest>=8.4.2",
    "ruff>=0.12.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/nrc_volt_sync"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
