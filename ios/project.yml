name: NRCVoltSyncHealth
options:
  bundleIdPrefix: io.github.nrcvoltsync
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.3.0
packages:
  HealthOutboxCore:
    path: .
targets:
  NRCVoltSyncHealth:
    type: application
    platform: iOS
    sources:
      - path: NRCVoltSyncHealth
    dependencies:
      - package: HealthOutboxCore
        product: HealthOutboxCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nrcvoltsync.health
        PRODUCT_NAME: NRC Volt Sync Health
        CODE_SIGN_ENTITLEMENTS: NRCVoltSyncHealth/NRCVoltSyncHealth.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NRC Volt Sync
        INFOPLIST_KEY_NSHealthShareUsageDescription: Export your running workouts and routes to a folder you choose.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  NRCVoltSyncHealth:
    build:
      targets:
        NRCVoltSyncHealth: all
    run:
      config: Debug
