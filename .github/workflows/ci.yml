name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run coverage run -m pytest -q
      - run: uv run coverage report
      - run: uv run ruff check .
      - run: uv run bandit -q -r src/nrc_volt_sync
      - run: uv run pip-audit
      - run: swift test --package-path ios
      - run: brew install xcodegen
      - run: xcodegen --spec ios/project.yml --project ios
      - run: git diff --exit-code -- ios/NRCVoltSyncHealth.xcodeproj
      - run: >-
          xcodebuild
          -project ios/NRCVoltSyncHealth.xcodeproj
          -scheme NRCVoltSyncHealth
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
